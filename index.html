/* ── foto ── */
function abrirFoto(id){
  var inp = document.getElementById(id);
  inp.value = "";
  inp.onchange = function(){
    var f = inp.files && inp.files[0];
    if(!f) return;
    comprimir(f,function(err,foto){
      if(err){ alert(err.message); return; }
      state.foto = foto; updateOutput();
    });
  };
  inp.click();
}
/* foto: se reduce a ~300 KB (lado mayor 1280 px) para que suba rápido con poca señal y quepan muchas en el reporte */
var FOTO_MAX_PX = 1280, FOTO_OBJETIVO = 300*1024;
function comprimir(file,cb){
  var url = URL.createObjectURL(file), img = new Image();
  img.onload = function(){
    var w=img.naturalWidth, h=img.naturalHeight, s=Math.min(1,FOTO_MAX_PX/Math.max(w,h));
    var cv=document.createElement("canvas"); cv.width=Math.round(w*s); cv.height=Math.round(h*s);
    cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
    URL.revokeObjectURL(url);
    var q = 0.78, d = cv.toDataURL("image/jpeg",q);
    while(d.length*0.75>FOTO_OBJETIVO && q>0.45){ q -= 0.08; d = cv.toDataURL("image/jpeg",q); }
    cb(null,{url:d,data:d.split(",")[1],mime:"image/jpeg"});
  };
  img.onerror = function(){ URL.revokeObjectURL(url); cb(new Error("No se pudo leer la imagen.")); };
  img.src = url;
}

/* ── subir ── */
/* firma = texto + foto (el turno/fecha no entran: si cambia la hora no debe verse como "otra" liberación) */
function firmaSubida(texto){ return texto+"|"+(state.foto?state.foto.data.length+state.foto.data.slice(-24):""); }
function camposDeTexto(texto){
  return texto.split("\n").map(function(l){ var i=l.indexOf(": "); return i>0?[l.slice(0,i).trim(),l.slice(i+2).trim()]:null; })
    .filter(function(x){return !!x;});
}
function nombreFoto(){
  var fr = getFrente(state.estructura), f = state.form, ctx = buildCtx();
  var p = [cfg.tipos[state.tipo].corto];
  if(state.tipo==="RELLENO"){
    if(f.material) p.push(f.material);
    if(ctx.d.capaFinal && ctx.d.capaFinal!=="UNICA") p.push(/^\d+(\.\d+)?$/.test(ctx.d.capaFinal)?"CAPA "+ctx.d.capaFinal:ctx.d.capaFinal);
    if(f.bpTipo) p.push(f.bpTipo);
  } else if(state.tipo==="COLECCION" && f.subtipoCol) p.push(f.subtipoCol+(f.diamCol?" Ø"+f.diamCol:""));
  else if(f.subtipo) p.push(f.subtipo);
  p.push(fr?(fr.corto||fr.nombre):"");
  return p.filter(Boolean).join(" - ");
}
function subirLiberacion(){
  var texto = computeTexto();
  if(!texto) return;
  if(!conectado()){
    state.subida = {sig:firmaSubida(texto),estado:"error",msg:"Primero conecta la app al sistema del equipo en ⚙ Configuración › Ajustes del generador."};
    updateOutput(); return;
  }
  var sig = firmaSubida(texto);
  var previo = (state.subida && state.subida.sig===sig && state.subida.estado==="error") ? state.subida : null;
  if(previo && previo.sel) return subirConfirmada(texto,sig,previo.sel,previo.uid);   // reintento: mismo uid y misma elección
  confirmarTurno(function(sel){ subirConfirmada(texto,sig,sel,null); });
}
/* tras guardar una liberación nueva: limpia el formulario y vuelve a Inicio con un aviso (cls "ok" verde, "aviso" ámbar) */
function terminarRegistro(msg,cls){
  resetForm(); nav.omitir = true; state.view="inicio"; state.flash=msg; state.flashCls=cls;
  render(); window.scrollTo(0,0);
}
function subirConfirmada(texto,sig,sel,uid){
  var auto = Turno.detectar(Date.now());
  var it = {uid:uid||newId(),texto:texto,campos:camposDeTexto(texto),nombreFoto:nombreFoto(),
            foto:state.foto?{data:state.foto.data,mime:state.foto.mime}:null,creado:Date.now(),
            turno:sel.turno,fecha:sel.fecha,turnoAuto:auto.turno,fechaAuto:auto.fecha,
            ajusteManual:(sel.turno!==auto.turno||sel.fecha!==auto.fecha),
            form:JSON.stringify({v:1,estructura:state.estructura,tipo:state.tipo,form:state.form})};
  state.subida = {sig:sig,estado:"subiendo",uid:it.uid,sel:sel}; updateOutput();
  enviarItem(it).then(function(j){
    agregarReciente({id:j.id,fecha:it.fecha,hora:Turno.hora(it.creado),
                     texto:it.texto,turno:it.turno,form:it.form,foto:j.foto||"",propia:true});
    var vigente = !!(state.subida && state.subida.sig===sig);
    if(vigente) state.subida = {sig:sig,estado:"ok",id:j.id};
    /* guardada: vuelve a Inicio (donde aparece entre las 3 últimas) con el aviso */
    if(vigente && state.view==="main" && !state.editando) terminarRegistro("Registrada como "+j.id+(state.foto?" con foto":"")+".","ok");
    else updateOutput();
  },function(e){
    if(e.server && !e.acceso){ state.subida = {sig:sig,estado:"error",uid:it.uid,sel:sel,msg:"No se pudo subir: "+e.message}; }
    else {
      encolar(it).then(function(ok){
        state.subida = ok ? {sig:sig,estado:"cola"}
          : {sig:sig,estado:"error",uid:it.uid,sel:sel,msg:"Sin señal y sin espacio para guardarla en el celular. Inténtalo con señal."};
        if(ok && state.view==="main" && !state.editando) terminarRegistro("Sin señal: se guardó en el celular y se subirá sola.","aviso");
        else render();
      });
      return;
    }
    render();
  });
}

function updateOutput(){
  pintarErrores();
  var box = document.getElementById("outbox");
  var hint = document.getElementById("hintbox");
  var t = computeTexto();
  if(t){
    if(hint && hint.parentNode) hint.parentNode.removeChild(hint);
    if(box){ box.parentNode.replaceChild(buildOutBox(t),box); }
    else { document.getElementById("app").appendChild(buildOutBox(t)); }
  } else {
    if(box && box.parentNode) box.parentNode.removeChild(box);
    if(!hint && state.tipo)
      document.getElementById("app").appendChild(el("div",{class:"hint",id:"hintbox"},["Completa todos los campos para generar el texto"]));
  }
}

var APP_VERSION = "2.4.1-beta1";
var SVG_SOL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg>';
var SVG_LUNA = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>';
/* Turno y día de trabajo: se detectan solos con la hora de Lima (ver turno.js):
   DÍA 07:00–18:59 · NOCHE 19:00–06:59 (de 00:00 a 06:59 cuenta para el día anterior).
   El usuario puede cambiarlos a mano (dura 2 h) y siempre se le pide confirmar antes de subir. */
var MANUAL_MS = 2*3600000;
function manualVigente(){ return !!state.manualTs && (Date.now()-state.manualTs)<MANUAL_MS; }
function turnoAuto(){ return Turno.detectar(Date.now()); }
function turnoActual(){ if(state.editando) return state.editando.turno; return (manualVigente() && state.turnoMan) ? state.turnoMan : turnoAuto().turno; }
function fechaActual(){
  if(state.editando) return state.editando.fecha;
  if(manualVigente() && state.fechaMan) return state.fechaMan;
  return Turno.fechaPara(turnoActual(),Date.now());
}
function limpiarManual(){ state.turnoMan=""; state.fechaMan=""; state.manualTs=0; }
function hayManual(){ return !state.editando && manualVigente() && !!(state.turnoMan||state.fechaMan); }
/* guarda la elección manual; si coincide con lo automático, vuelve a automático */
function fijarTurnoFecha(turno,fecha){
  if(state.editando){ state.editando.turno = turno; state.editando.fecha = fecha; return; }
  var a = turnoAuto();
  state.turnoMan = (turno===a.turno) ? "" : turno;
  state.fechaMan = (fecha===Turno.fechaPara(turno,Date.now())) ? "" : fecha;
  state.manualTs = (state.turnoMan||state.fechaMan) ? Date.now() : 0;
}
var SVG_CAL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>';
function fechaBtn(){
  var f = fechaActual(), manual = hayManual() && !!state.fechaMan;
  var w = el("label",{class:"fechabtn"+(manual?" manual":""),title:manual?"Fecha cambiada a mano":"Fecha del turno · toca para cambiarla"});
  w.innerHTML = SVG_CAL+"<span>"+Turno.rotulo("DÍA",f).slice(6)+"</span>";
  var i = el("input",{type:"date",value:f,max:hoyStr(),"aria-label":"Fecha de la liberación"});
  i.addEventListener("click",function(e){ try{ if(i.showPicker){ e.preventDefault(); i.showPicker(); } }catch(err){} });
  i.addEventListener("change",function(){
    var v = i.value;
    if(!Turno.esFecha(v)) return;
    fijarTurnoFecha(turnoActual(),v);
    render();
  });
  w.appendChild(i);
  return w;
}
function turnoBtn(){
  var t = turnoActual(), esDia = t!=="NOCHE", manual = hayManual() && !!state.turnoMan;
  var b = el("button",{class:"turno "+(esDia?"dia":"noche")+(manual?" manual":""),type:"button",
    "aria-label":"Turno "+(esDia?"día":"noche")+(manual?" (cambiado a mano)":" (automático)")+". Toca para cambiar"});
  b.innerHTML = (esDia?SVG_SOL:SVG_LUNA)+"<span>Turno "+(esDia?"día":"noche")+"</span>";
  b.addEventListener("click",function(){
    var nuevo = esDia?"NOCHE":"DÍA";
    fijarTurnoFecha(nuevo,state.editando?state.editando.fecha:Turno.fechaPara(nuevo,Date.now()));
    render();
  });
  return b;
}

/* ── confirmación antes de registrar: ¿turno y día correctos? ── */
function confirmarTurno(onOk){
  var sel = {turno:turnoActual(), fecha:fechaActual()};
  var viejo = document.getElementById("ovTurno"); if(viejo) viejo.parentNode.removeChild(viejo);
  var previo = document.activeElement;
  var ov = el("div",{class:"ov",id:"ovTurno",role:"dialog","aria-modal":"true","aria-labelledby":"ovTit"});
  var box = el("div",{class:"ovbox"});
  var nota = el("div",{class:"ovnota","aria-live":"polite"});
  var fi = el("input",{type:"date",value:sel.fecha,max:hoyStr(),id:"ovFecha"});
  var bD = el("button",{type:"button",class:"seg dia"},[""]), bN = el("button",{type:"button",class:"seg noche"},[""]);
  bD.innerHTML = SVG_SOL+"<span>Día</span>"; bN.innerHTML = SVG_LUNA+"<span>Noche</span>";
  function pinta(){
    bD.className = "seg dia"+(sel.turno==="DÍA"?" on":""); bN.className = "seg noche"+(sel.turno==="NOCHE"?" on":"");
    bD.setAttribute("aria-pressed",sel.turno==="DÍA"); bN.setAttribute("aria-pressed",sel.turno==="NOCHE");
    fi.value = sel.fecha;
    var a = turnoAuto();
    var msg = "Se incluirá en el reporte del <b>"+Turno.fechaCorta(sel.fecha)+"</b>, turno <b>"+(sel.turno==="DÍA"?"día":"noche")+"</b>.";
    if(sel.turno==="NOCHE") msg += " La noche empieza a las 19:00 y llega hasta las 06:59 del día siguiente.";
    var dif = Turno.diasEntre(sel.fecha,Turno.hoy());
    if(dif>=2) msg += ' <span class="adv">⚠ Es una fecha de hace '+dif+' días.</span>';
    if(a.turno!==sel.turno || a.fecha!==sel.fecha) msg += '<br><span class="aut">Por la hora ('+a.hora+') sería: '+Turno.rotulo(a.turno,a.fecha)+'.</span>';
    nota.innerHTML = msg;
  }
  bD.addEventListener("click",function(){ if(sel.turno!=="DÍA"){ sel.turno="DÍA"; sel.fecha=Turno.fechaPara("DÍA",Date.now()); pinta(); } });
  bN.addEventListener("click",function(){ if(sel.turno!=="NOCHE"){ sel.turno="NOCHE"; sel.fecha=Turno.fechaPara("NOCHE",Date.now()); pinta(); } });
  fi.addEventListener("change",function(){ if(Turno.esFecha(fi.value)){ sel.fecha=fi.value; } pinta(); });
  function cerrar(){
    document.removeEventListener("keydown",tecla,true);
    if(ov.parentNode) ov.parentNode.removeChild(ov);
    if(previo && previo.focus) try{ previo.focus(); }catch(e){}
  }
  var bNo = el("button",{type:"button",class:"b-sec"},["Cancelar"]);
  var bSi = el("button",{type:"button",class:"b-ok"},["Sí, registrar"]);
  bNo.addEventListener("click",cerrar);
  bSi.addEventListener("click",function(){
    if(!Turno.esFecha(sel.fecha) || Turno.diasEntre(sel.fecha,Turno.hoy())<0){ pinta(); fi.focus(); return; }
    cerrar(); fijarTurnoFecha(sel.turno,sel.fecha); onOk({turno:sel.turno,fecha:sel.fecha});
  });
  function tecla(e){
    if(e.key==="Escape"){ e.preventDefault(); cerrar(); return; }
    if(e.key==="Tab"){   // el foco se queda dentro del cuadro
      var f = [bD,bN,fi,bNo,bSi], i = f.indexOf(document.activeElement);
      if(e.shiftKey && i<=0){ e.preventDefault(); f[f.length-1].focus(); }
      else if(!e.shiftKey && i===f.length-1){ e.preventDefault(); f[0].focus(); }
    }
  }
  document.addEventListener("keydown",tecla,true);
  box.appendChild(el("h2",{id:"ovTit"},["¿Turno y día correctos?"]));
  box.appendChild(el("div",{class:"segs"},[bD,bN]));
  box.appendChild(el("label",{"for":"ovFecha"},["Día de trabajo"]));
  box.appendChild(fi);
  box.appendChild(nota);
  box.appendChild(el("div",{class:"btns"},[bNo,bSi]));
  ov.appendChild(box); document.body.appendChild(ov);
  pinta(); bSi.focus();
}

/* cabecera con el logo de Stracon, el nombre de la herramienta y quién está conectado */
function cabecera(conAjustes){
  var chip = null;
  if(usaServidor() && sesion && sesion.nombre){
    var txt = sesion.nombre+(activo()&&sesion.rol!=="registro"?" · "+(sesion.rol==="admin"?"Administrador":"Editor"):"");
    chip = el("div",{class:"chip"},[el("i",{class:"dot"+(activo()?" on":"")}),document.createTextNode(txt)]);
  }
  var menu = conAjustes ? menuConfiguracion() : null;
  return el("div",{class:"hdr hdr-logo"},[
    el("div",{class:"hdr-top"},[
      el("img",{class:"logo",src:"logo-der.png",alt:"Stracon",onerror:function(){ this.style.display="none"; }}),
      el("span",{class:"sep","aria-hidden":"true"}),
      el("div",{class:"ttl"},[el("div",{class:"t"},["Generador de Liberación"]),el("div",{class:"k"},["HERRAMIENTA CQC"])])
    ]),
    (chip||menu)?el("div",{class:"hdr-bar"},[chip||el("span"),menu]):null
  ]);
}

/* botón «⚙ Configuración ▾» que despliega: Inicio, Mi perfil, Ajustes del generador y Cerrar sesión (Mi perfil y Cerrar sesión solo con sesión activa) */
function menuConfiguracion(){
  var wrap = el("div",{class:"menu-wrap"});
  var btn = el("button",{class:"hbtn",type:"button","aria-haspopup":"menu","aria-expanded":"false"},["⚙ Configuración ▾"]);
  var lista = null;
  function cerrar(){
    if(!lista) return;
    wrap.removeChild(lista); lista = null; btn.setAttribute("aria-expanded","false");
    document.removeEventListener("click",fuera,true); document.removeEventListener("keydown",tecla,true);
  }
  function fuera(e){ if(!wrap.contains(e.target)) cerrar(); }
  function tecla(e){ if(e.key==="Escape"){ cerrar(); btn.focus(); } }
  function opcion(texto,fn){
    return el("button",{class:"menu-it",type:"button",role:"menuitem",onclick:function(){ cerrar(); fn(); }},[texto]);
  }
  btn.addEventListener("click",function(){
    if(lista){ cerrar(); return; }
    var items = [opcion("Inicio",irInicio)];
    if(usaServidor() && activo()) items.push(opcion("Mi perfil",abrirPerfil));
    items.push(opcion("Ajustes del generador",abrirConfig));
    if(usaServidor() && activo()) items.push(opcion("Cerrar sesión",pedirCerrarSesion));
    lista = el("div",{class:"menu",role:"menu"},items);
    wrap.appendChild(lista); btn.setAttribute("aria-expanded","true");
    document.addEventListener("click",fuera,true); document.addEventListener("keydown",tecla,true);
    items[0].focus();
  });
  wrap.appendChild(btn);
  return wrap;
}

/* aviso de una sola vez (guardado, eliminado, configuración…) */
function avisoFlash(app){
  if(!state.flash) return;
  app.appendChild(noteBox([state.flash],state.flashCls==="aviso"?"":(state.flashCls||"ok")));   // "aviso" = ámbar; por defecto verde
  state.flash=""; state.flashCls="";
}
/* ── historial de pantallas: botones «‹ Atrás» y «Adelante ›» entre la cabecera y el contenido ──
   Se arma solo a partir de la pantalla que muestra render(), sin tocar cada botón de la app.
   Los frentes/líneas/material de Ajustes cuentan como «Ajustes»; editar una liberación no se puede volver a abrir con Adelante. */
var nav = {atras:[], adelante:[], actual:null, omitir:false};
function claveNav(){
  var v = state.view;
  if(v==="frente"||v==="lineas"||v==="material") return "config";
  if(v==="main" && state.editando) return "edicion";
  return v;
}
function navPermitido(k){
  if(k==="perfil") return !!(usaServidor() && activo() && sesion);
  if(k==="usuarios") return !!(usaServidor() && activo() && sesion && sesion.rol==="admin");
  return true;
}
function navHay(pila){
  for(var i=0;i<pila.length;i++) if(navPermitido(pila[i])) return true;
  return false;
}
/* anota la pantalla actual en el historial cuando cambió por una acción normal de la app */
function navRegistrar(){
  var k = claveNav();
  if(nav.actual===null){ nav.actual = k; return; }
  if(k===nav.actual) return;
  var consumida = nav.omitir || nav.actual==="edicion"; nav.omitir = false;   // el registro recién subido o la edición terminada: ya no hay a qué volver
  if(consumida){ if(nav.atras.length && nav.atras[nav.atras.length-1]===k) nav.atras.pop(); }   // volvió a donde estaba: no se duplica
  else nav.atras.push(nav.actual);
  if(nav.atras.length>30) nav.atras.shift();
  nav.adelante = []; nav.actual = k;
}
function navReiniciar(){ nav.atras = []; nav.adelante = []; nav.actual = null; nav.omitir = false; }
/* antes de salir de una pantalla con trabajo a medias (Ajustes sin guardar o una edición) se pregunta */
function navPuedeSalir(){
  if(ed && (ed.dirty || ed.frDirty || ed.matDirty)){
    if(!confirm("Hay cambios sin guardar. ¿Descartarlos?")) return false;
  } else if(state.editando){
    if(!confirm("Estás editando una liberación. Si sales, se descartan los cambios. ¿Salir?")) return false;
  }
  ed = null;
  if(state.editando){ state.editando = null; resetForm(); }
  return true;
}
function navIr(k){
  if(k==="hoy"){ state.view = "hoy"; cargarRango(); }
  else if(k==="config") abrirConfig();
  else if(k==="perfil") abrirPerfil();
  else if(k==="usuarios") abrirUsuarios();
  else { state.view = (k==="main")?"main":"inicio"; render(); }
  window.scrollTo(0,0);
}
function navMover(dir){
  var pila = dir<0 ? nav.atras : nav.adelante, otra = dir<0 ? nav.adelante : nav.atras;
  while(pila.length && !navPermitido(pila[pila.length-1])) pila.pop();   // pantallas a las que ya no se tiene acceso
  if(!pila.length){ render(); return; }
  if(!navPuedeSalir()) return;
  var k = pila.pop();
  if(nav.actual && nav.actual!=="edicion") otra.push(nav.actual);
  nav.actual = k;
  navIr(k);
}
function navBarra(){
  var a = el("button",{class:"navbtn",id:"navAtras",type:"button","aria-label":"Pantalla anterior",title:"Pantalla anterior",disabled:!navHay(nav.atras)},["‹ Atrás"]);
  var d = el("button",{class:"navbtn",id:"navAdelante",type:"button","aria-label":"Pantalla siguiente",title:"Pantalla siguiente",disabled:!navHay(nav.adelante)},["Adelante ›"]);
  a.addEventListener("click",function(){ navMover(-1); });
  d.addEventListener("click",function(){ navMover(1); });
  return el("div",{class:"navrow"},[a,d]);
}

/* ── navegación entre las pantallas principales ── */
function irInicio(){
  if(state.editando){ state.editando=null; resetForm(); }   // salir de una edición la descarta
  state.view="inicio"; render(); window.scrollTo(0,0);
}

function renderMain(app){
  app.appendChild(cabecera(true));
  if(state.editando) app.appendChild(noteBox(["Editando la liberación "+state.editando.id+" (el ID no cambia). Corrige lo que haga falta y pulsa «Guardar cambios»."],""));
  avisoFlash(app);
  var av = avisoCola(); if(av) app.appendChild(av);

  var card = el("div",{class:"card"});
  var hayCopia = Object.keys(state.copiados).length>0;
  card.appendChild(el("div",{class:"trow"},[
    hayCopia?el("div",{class:"copia"},[el("i"),el("span",null,["Copiado"+(state.origen?" de "+state.origen:"")+" · lo resaltado aún no se modifica"]),
      el("button",{type:"button","aria-label":"Quitar resaltado",onclick:function(){ state.copiados={}; state.origen=""; render(); }},["✕"])]):null,
    fechaBtn(), turnoBtn()
  ]));
  card.appendChild(fieldWrap("1. Frente",
    optsCtl(state.estructura,cfg.frentes.map(function(f){return f.id;}),function(v){
      state.estructura=v; state.tipo=""; prefs.frente=v; savePrefs(); resetForm(); render();
    },{labelFn:function(id){ var f=getFrente(id); return f?(f.corto||f.nombre):id; },cp:!!state.copiados.__frente})));

  var fr = getFrente(state.estructura);
  if(fr){
    card.appendChild(fieldWrap("2. Tipo de Liberación",
      optsCtl(state.tipo,fr.tipos,function(v){ state.tipo=v; resetForm(); render(); },
        {labelFn:function(k){return cfg.tipos[k].corto;},cp:!!state.copiados.__tipo})));
  }
  var schema = SCHEMAS[state.tipo];
  if(schema) renderSchema(schema,buildCtx(),card);
  app.appendChild(card);

  var texto = computeTexto();
  if(texto) app.appendChild(buildOutBox(texto));
  else if(state.tipo) app.appendChild(el("div",{class:"hint",id:"hintbox"},["Completa todos los campos para generar el texto"]));
  app.appendChild(el("div",{class:"ver"},["Versión "+APP_VERSION]));
}

/* ── liberaciones anteriores: rango de fechas (día de trabajo) + filtro de texto + exportar a Excel ── */
var DIAS_INICIAL = 7;   // al abrir: hoy y los 6 días anteriores
var dia = {desde:"",hasta:"",q:"",estado:"",items:[],hoja:"",msg:"",total:0,truncado:false,n:0};
function hoyStr(off){ return Turno.hoy(Date.now(),off); }   // fecha calendario de Lima
function abrirDia(){
  dia.desde = hoyStr(1-DIAS_INICIAL); dia.hasta = hoyStr(); dia.q = "";
  state.view="hoy"; cargarRango(); window.scrollTo(0,0);
}
function fechaValida(f){ return /^\d{4}-\d{2}-\d{2}$/.test(f||"") && !isNaN(Date.parse(f+"T12:00:00Z")); }
function cargarRango(){
  if(!fechaValida(dia.desde) || !fechaValida(dia.hasta)){ dia.estado="error"; dia.msg="Elige las dos fechas (desde y hasta)."; dia.items=[]; render(); return; }
  var n = ++dia.n, d = dia.desde, h = dia.hasta;
  dia.estado="cargando"; dia.items=[]; dia.msg=""; render();
  api("listRango",{desde:d,hasta:h},60000).then(function(j){
    if(dia.n!==n) return;
    dia.estado="ok"; dia.items=j.items||[]; dia.hoja=j.hoja||""; dia.total=j.total||dia.items.length; dia.truncado=!!j.truncado; render();
  },function(e){
    if(dia.n!==n) return;
    dia.estado="error";
    dia.msg = /desconocida/i.test(e.message) ? "Para filtrar por fechas hay que actualizar el servidor (Code.gs)." : e.message;
    render();
  });
}
/* cambia una de las dos fechas; si queda "desde" después de "hasta" (o al revés), la otra se iguala */
function cambiarFecha(cual,valor){
  if(!fechaValida(valor)){ render(); return; }   // la fecha se borró o quedó incompleta: se restaura la anterior
  if(valor>hoyStr()) valor = hoyStr();
  dia[cual] = valor;
  if(dia.desde>dia.hasta){ if(cual==="desde") dia.hasta = valor; else dia.desde = valor; }
  cargarRango();
}
/* liberaciones ya cargadas que cumplen el filtro de texto (más nuevas primero) */
function filtradasDia(){
  var q = dia.q.trim();
  return dia.items.filter(function(it){ return !q || coincide(it.texto+" "+(it.id||""),q); }).slice().reverse();
}
function idDrive(url){ var m=/\/d\/([\w-]+)/.exec(url||"")||/[?&]id=([\w-]+)/.exec(url||""); return m?m[1]:""; }
function lineaDe(texto,clave){
  var l = (texto||"").split("\n").filter(function(x){return x.indexOf(clave+": ")===0;})[0];
  return l?l.slice(clave.length+2):"";
}
/* ── últimas liberaciones (pantalla de inicio) ── */
var SVG_IMAN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 15-4-4 6.75-6.77a7.79 7.79 0 0 1 11 11L13 22l-4-4 6.39-6.36a2.14 2.14 0 0 0-3-3L6 15"/><path d="m5 8 4 4"/><path d="m12 15 4 4"/></svg>';
function botonIman(it){

  b.innerHTML = SVG_IMAN;
  b.addEventListener("click",function(){ duplicar(it); });

/* ✎ editar: el editor y el admin editan cualquiera; quien solo registra, las suyas */
function puedeEditar(it){ return activo() && (esEditor() || it.propia===true); }
function botonEditar(it){
  if(!puedeEditar(it) || !it.id) return null;
  var b = el("button",{class:"iman edit",type:"button",title:"Editar liberación","aria-label":"Editar liberación"},["✎"]);
  b.addEventListener("click",function(){ duplicar(it,true); });
  return b;
}
/* ✕ eliminar: solo para editores y administradores */
function botonBorrar(it,pendiente){
  if(!esEditor()) return null;
  var b = el("button",{class:"borrar",type:"button",title:"Eliminar liberación","aria-label":"Eliminar liberación"},["✕"]);
  b.addEventListener("click",function(){ eliminarLib(it,pendiente,b); });
  return b;
}
function quitarDeListas(id){
  function f(a){ return a.filter(function(x){ return x.id!==id; }); }
  recientes.items = f(recientes.items); guardarRecientes();
  dia.items = f(dia.items);
}
function eliminarLib(it,pendiente,btn){
  var quien = resumenLib(it.texto);
  if(pendiente){
    if(!confirm("¿Quitar esta liberación que aún no se sube?\n\n"+quien)) return;
    quitarDeCola(it.uid); render(); return;
  }
  if(!confirm("¿Eliminar esta liberación para todo el equipo?\n\n"+(it.id?it.id+" · ":"")+quien+"\n\nSu foto pasa a la papelera de Drive.")) return;

function resumenLib(texto){

  var fr = findBy(cfg.frentes,"nombre",est), key = null, pt = {det:"",parcial:null};
  TIPO_KEYS.forEach(function(k){ if(!key && tl.indexOf(cfg.tipos[k].largo)===0){ key=k; pt=partesTipo(tl,cfg.tipos[k].largo); } });
  var p = [fr?(fr.corto||fr.nombre):est];
  if(key==="EVALUACION") p.push("EVALUACIÓN"+(c["MATERIAL"]?" "+c["MATERIAL"]:""));
  else if(c["MATERIAL"] && key!=="OVERLINER") p.push(c["MATERIAL"]);
  else p.push(key?cfg.tipos[key].corto:tl);
  var det = pt.det.replace("ZANJA DE ANCLAJE","ZANJA").replace("BERMA PERIMETRAL","BERMA").replace(/ - /g," ");
  var capa = c["CAPA"] && c["CAPA"]!=="UNICA" ? (isNaN(c["CAPA"])?c["CAPA"]:"CAPA "+c["CAPA"]) : "";
  var t3 = [det,capa].filter(Boolean).join(" "); if(t3) p.push(t3);
  if(pt.parcial!=null) p.push("PARCIAL"+(pt.parcial?" "+pt.parcial:""));
  var diams = Object.keys(c).filter(function(k){return k.indexOf("LONG. TUB")===0;})
    .map(function(k){ var m=/Ø\s*([\d\/]+)/.exec(k); return m?"Ø"+m[1]:""; }).filter(Boolean);
  if(diams.length) p.push(diams.join(" + "));
  if(c["LÍNEA"]) p.push(c["LÍNEA"]);
  if(c["PROGRESIVA"]) p.push("PROG: "+c["PROGRESIVA"]);
  else if(c["COTA"] && c["COTA"]!=="VARIABLE") p.push("COTA: "+sinUnidad(c["COTA"]));
  else if(c["ÁREA"]) p.push("ÁREA: "+c["ÁREA"]);
  return p.join(", ");
}

/* separa "TIPO (DETALLE) - PARCIAL (X)" en sus partes */
function partesTipo(tl, base){
  var ex = tl.indexOf(base)===0 ? tl.slice(base.length).trim() : "";
  var parcial = null, m = /\s*-\s*PARCIAL\s*\((.*)\)\s*$/.exec(ex);

function valsDesdeTexto(texto,tipo,frId){
  var c = camposMapa(texto), v = {};

        if(isNaN(c["CAPA"])) v.capaTxt = "SÍ";
      }
      if(c["ESPESOR"]==="VARIABLE") v.espVar = "SÍ"; else set("espesorM",c["ESPESOR"]);
      set("procedencia",c["PROCEDENCIA"]);
      if(c["COTA"] && c["COTA"]!=="VARIABLE") v.cota = u("COTA");
      set("area",u("ÁREA"));
      v.progFillBP = c["PROGRESIVA"]?"SÍ":"NO"; set("progresiva",c["PROGRESIVA"]);
      set("ensayo",c["ENSAYO"]);
      v.nroEnsayoChk = c["N° ENSAYO"]?"SÍ":"NO"; set("nroEnsayo",c["N° ENSAYO"]);

      v.progFill = c["PROGRESIVA"]?"SÍ":"NO"; set("progFund",c["PROGRESIVA"]);
      set("protFund",c["PROTOCOLO"]);
      break;
    case "EVALUACION":
      set("materialEval",c["MATERIAL"]); set("areaEval",u("ÁREA")); set("progEval",c["PROGRESIVA"]);
      set("ensayoEval",c["ENSAYO"]); set("protEval",c["PROTOCOLO"]);
      break;
    case "OVERLINER":
      set("espOver",c["ESPESOR"]); set("areaOver",u("ÁREA")); set("ensayoOver",c["ENSAYO"]); set("protOver",c["PROTOCOLO"]);
      break;
    case "SUBDRENES":
      v.subtipo = longs.length?SUBTIPO.TOTAL:SUBTIPO.SOLO_FUND;
      var lm = /-(\d{3})-/.exec(c["LÍNEA"]||"");
      set("tuberia",diam(longs[0])||(lm?lm[1]:""));
      set("progresiva",c["PROGRESIVA"]); set("grava",u("ÁREA")); set("linea",c["LÍNEA"]);

      set("areaCol",u("ÁREA")); set("progresiva",c["PROGRESIVA"]);
      set("ensayoCol",c["ENSAYO"]); set("protCol",c["PROTOCOLO"]);
      break;
    case "SIST_SUBD":
      v.subtipo = !longs.length?SUBTIPO.SOLO_FUND:(c["FUNDACIÓN"]!=null?SUBTIPO.FUND_TUB:SUBTIPO.TOTAL);

  if(parc!=null){ v.parcial = "SÍ"; v.parcialTexto = parc; }
  var fr = getFrente(frId), presente = {PROC:["PROCEDENCIA"],CAPA:["CAPA"],ESP:["ESPESOR"],AREA:["ÁREA"],COTA:["COTA"],
    PROG:["PROGRESIVA"],LINEA:["LÍNEA"],LONG:["LONG. TUB"],GRAVA:["GRAVA Y GEOTEXTIL","FUNDACIÓN","GRAVA"]};

function nombreListado(desde,hasta,filtrado){
  return "Liberaciones_"+(desde===hasta?desde:desde+"_a_"+hasta)+(filtrado?"_filtro":"")+".xlsx";

function armarListado(items){
  var orden = items.slice().sort(function(a,b){
    var ka = (a.fecha||"")+" "+(a.fechaReal||a.fecha||"")+" "+(a.hora||""), kb = (b.fecha||"")+" "+(b.fechaReal||b.fecha||"")+" "+(b.hora||"");

  });
  var wb = new ExcelJS.Workbook();

  var ws = wb.addWorksheet("Liberaciones",{views:[{state:"frozen",ySplit:1}]});
  ws.columns = COLS_LISTADO.map(function(c){ return {header:c[0],key:c[0],width:c[1]}; });
  var cab = ws.getRow(1);

      cell.border = BORDE;

    });
  });
  ws.autoFilter = {from:{row:1,column:1},to:{row:1,column:COLS_LISTADO.length}};
  return wb.xlsx.writeBuffer().then(function(buf){
    return new Blob([buf],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});

/* turno de una liberación del servidor (si no trae, se deduce de fecha+hora como en las filas antiguas) */

/* ── interpretar cada liberación a partir de su texto ── */
function camposMapa(texto){ var m={}; camposDeTexto(texto).forEach(function(c){ if(!(c[0] in m)) m[c[0]]=c[1]; }); return m; }
function oracion(s){ s=String(s||"").toLowerCase(); return s.charAt(0).toUpperCase()+s.slice(1); }
function nombrePropio(s){ return String(s||"").toLowerCase().replace(/(^|\s)(\S)/g,function(a,b,c){return b+c.toUpperCase();}); }
function numero(s){ var m=/-?\d+(\.\d+)?/.exec(String(s||"").replace(/,/g,"")); return m?Number(m[0]):null; }
function sinUnidad(s){ return String(s||"").replace(/\s*(m²|m2|msnm|m)\s*$/i,"").trim(); }

function interpretarLib(it){
  var c = camposMapa(it.texto);
  var tipoTxt = c["TIPO DE LIBERACIÓN"]||"", est = c["ESTRUCTURA"]||"";
  var key = null, detalle = "", parcial = null;
  TIPO_KEYS.forEach(function(k){
    var l = cfg.tipos[k].largo;
    if(!key && tipoTxt.indexOf(l)===0){ key=k; var pt=partesTipo(tipoTxt,l); detalle=pt.det; parcial=pt.parcial; }
  });
  /* datos estructurados guardados con la liberación: no dependen de cómo se llamen hoy los frentes/tipos */
  var fm = null; try{ fm = it.form ? JSON.parse(it.form) : null; }catch(e){ fm = null; }
  if(fm && fm.tipo && cfg.tipos[fm.tipo]) key = fm.tipo;
  var fr = (fm && fm.estructura && getFrente(fm.estructura)) || findBy(cfg.frentes,"nombre",est);
  var mat = c["MATERIAL"]||"";
  var cat;
  if(key==="RELLENO"){
    var md = fr?getMat(fr,mat):null;
    if(/BAJA PERMEABILIDAD/.test(mat)) cat="SBP";
    else if(/SOBRERREVEST/.test(mat)) cat="SOBRE";
    else cat="RELLENO";
  } else if(key==="OVERLINER") cat="SOBRE";
  else if(key==="FUNDACION") cat="FUND";
  else if(key==="EVALUACION") cat="EVAL";
  else if(key==="COLECCION") cat="COL";
  else if(key==="SUBDRENES"||key==="SIST_SUBD")
    cat = Object.keys(c).some(function(k){return k.indexOf("LONG. TUB")===0;})?"SSUB":"FSUB";
  else cat="OTRO";

  var h = parseInt(String(it.hora||"").split(":")[0],10);
  var longs = Object.keys(c).filter(function(k){return k.indexOf("LONG. TUB")===0;});
  var diam = longs.map(function(k){ var m=/Ø\s*([\d\/]+)/.exec(k); return m?m[1]:""; }).filter(Boolean).join(" / ");
  var cota = c["COTA SUP."]? sinUnidad(c["COTA SUP."])+" - "+sinUnidad(c["COTA INF."]) :
             c["COTA"]? (c["COTA"]==="VARIABLE"?"Variable":sinUnidad(c["COTA"])) : "";
  var sec = /SECTOR\s+(\S+)/.exec(est), fase = /FASE\s+(\S+)/.exec(est);
  var esp = c["ESPESOR"] && c["ESPESOR"]!=="VARIABLE" ? numero(c["ESPESOR"]) : null;
  var area = c["ÁREA"]||c["GRAVA Y GEOTEXTIL"]||c["GRAVA"]||c["FUNDACIÓN"]||"";

  var desc = descripcionLib(cat,key,c,mat,detalle,parcial,longs,diam);
  return {
    id:it.id, cat:cat, frente:fr, estructura:est, desc:desc, texto:it.texto,
    turno: turnoDeItem(it)==="NOCHE"?"Noche":"Día",
    capa: c["CAPA"]?(c["CAPA"]==="UNICA"?"Única":c["CAPA"]):"-",
    sector: sec?oracion(sec[1]):"-", fase: fase?fase[1]:"-",
    cantera: c["PROCEDENCIA"]?nombrePropio(c["PROCEDENCIA"]):"-",
    area: numero(area), espesor: c["ESPESOR"]==="VARIABLE"?"Variable":(esp!=null?Math.round(esp*1000):null),
    longitud: longs.map(function(k){return sinUnidad(c[k]);}).join(" / "),
    diametro: diam, grava: numero(c["GRAVA Y GEOTEXTIL"]||c["GRAVA"]||c["FUNDACIÓN"]||(cat==="SSUB"?c["ÁREA"]:"")||""),
    progCota: c["PROGRESIVA"]||cota||"-",
    supervisor: nombrePropio(c["SUPERVISOR CQC"]||""),
    foto: it.fotoData||null
  };
}

/* "Liberación [parcial] de <qué> [en/, detalle][, capa N]" — el mismo texto va en la tabla y en la foto */
function descripcionLib(cat,key,c,mat,detalle,parcial,longs,diam){
  function low(s){ return String(s||"").toLowerCase(); }
  var det = low(detalle).replace(/ - /g,", ");
  var diamTxt = diam ? diam.replace(/\s*\/\s*/g," y ")+" mm" : "";
  var capa = c["CAPA"] && c["CAPA"]!=="UNICA" ? (/^\d+(\.\d+)?$/.test(c["CAPA"])?"capa "+c["CAPA"]:low(c["CAPA"])) : "";
  var obj, detUsado = false;
  switch(cat){
    case "RELLENO": obj = low(mat); break;
    case "SBP":     obj = "suelo de baja permeabilidad"+(det?" en "+det:""); detUsado = true; break;
    case "SOBRE":   obj = "colocación de "+low(mat||"OVERLINER"); break;
    case "FUND":    obj = "terreno de fundación"; break;
    case "EVAL":    obj = "evaluación de material"+(mat?" "+low(mat):""); break;
    case "COL":
      obj = (c["ÁREA"]!=null?"overliner y tubería del ":"")+"sistema de colección de solución"+(diamTxt?" de "+diamTxt:"");
      break;
    case "SSUB": case "FSUB":
      if(key==="SIST_SUBD")
        obj = longs.length ? (c["FUNDACIÓN"]!=null?"fundación y tubería del ":"")+"sistema de subdrenaje"+(diamTxt?" de "+diamTxt:"")
                           : "fundación del sistema de subdrenaje";
      else obj = longs.length ? "instalación de subdren"+(diamTxt?" de "+diamTxt:"") : "fundación de subdren";
      if(c["LÍNEA"]) obj += ", línea "+c["LÍNEA"];
      break;
    default: obj = low(c["TIPO DE LIBERACIÓN"]);
  }
  var d = "Liberación"+(parcial!=null?" parcial"+(parcial?" ("+low(parcial)+")":""):"")+" de "+obj;
  if(det && !detUsado) d += ", "+det;
  if(capa && (cat==="RELLENO"||cat==="SBP"||cat==="SOBRE")) d += ", "+capa;
  return d;
}

function estilo(cell,o){

function hojaFotos(wb,x){
  var ws = wb.addWorksheet("P. FOTOG.",{views:[{showGridLines:false}]});
  Object.keys(COLW_PF).forEach(function(k){ ws.getColumn(k).width = COLW_PF[k]; });
  ws.getRow(1).height=20; ws.getRow(2).height=20;
  encabezadoLogos(ws,x.L1,x.L2,9);
  celda(ws,"E3:I3","REPORTE DIARIO DE CONTROL DE CALIDAD",{size:12,bold:true});
  celda(ws,"C4:F4","6. PANEL FOTOGRÁFICO:",{bold:true,h:"left",wrap:false});
  var FILA = 14.45, r = 5, enPagina = 5, POR_PAGINA = 54;
  function saltoSi(n){
    if(enPagina+n > POR_PAGINA){ ws.getRow(r-1).addPageBreak(); enPagina = 0; }
    enPagina += n;
  }
  var hay = false;
  x.nombres.forEach(function(n){
    var fotos = [];
    REP_TABLAS.forEach(function(t){ x.grupos[n].forEach(function(l){ if(l.cat===t.cat && l.foto) fotos.push(l); }); });
    if(!fotos.length) return;
    hay = true;
    saltoSi(2+17);
    celda(ws,"C"+r+":K"+r,n,{size:14,bold:true}); ws.getRow(r).height=18.6; r+=2;
    for(var i=0;i<fotos.length;i+=2){
      if(i>0) saltoSi(17);
      [fotos[i],fotos[i+1]].forEach(function(l,lado){
        if(!l) return;
        var c1 = lado?"H":"C", c2 = lado?"K":"F";
        celda(ws,c1+r+":"+c2+(r+13),"",{border:true});
        celda(ws,c1+(r+14)+":"+c2+(r+15),l.desc,{v:"top",h:"left",border:true,size:10});
        ponerFoto(wb,ws,l,c1,c2,r,r+13,FILA);
      });
      for(var k=r;k<r+16;k++) ws.getRow(k).height = FILA;
      // alto del pie según el texto más largo del par (≈ 50 caracteres por línea)
      var lin = Math.max.apply(null,[fotos[i],fotos[i+1]].filter(Boolean).map(function(l){ return Math.ceil(l.desc.length/50); }));
      if(lin>2){ ws.getRow(r+14).height = FILA*lin/2; ws.getRow(r+15).height = FILA*lin/2; }
      r += 17;
    }
  });
  if(!hay) celda(ws,"C"+(r+1)+":K"+(r+1),"No se registraron fotos de liberaciones este día.",{h:"left"});
  pagina(ws,"L",Math.max(r,8));
}

function ponerFoto(wb,ws,l,c1,c2,r1,r2,filaPt){
  var anchos = []; for(var k=colN(c1);k<=colN(c2);k++) anchos.push(pxCol(COLW_PF[String.fromCharCode(64+k)]));
  var boxW = anchos.reduce(function(a,b){return a+b;},0), filaPx = filaPt*96/72, boxH = (r2-r1+1)*filaPx;
  var iw = l.fw||4, ih = l.fh||3;
  var m = 6, s = Math.min((boxW-2*m)/iw,(boxH-2*m)/ih), w = iw*s, h = ih*s;
  var offX = (boxW-w)/2, offY = (boxH-h)/2;
  var col = colN(c1)-1, rest = offX, i = 0;
  while(i<anchos.length && rest>anchos[i]){ rest-=anchos[i]; col++; i++; }
  var id = wb.addImage({base64:l.foto,extension:"jpeg"});
  ws.addImage(id,{tl:{col:col+rest/anchos[i],row:(r1-1)+offY/filaPx},ext:{width:w,height:h},editAs:"oneCell"});
}

function cfgInput(value,ph,fk,onIn,opt){
  opt=opt||{};
  var i=el("input",{type:"text",value:value==null?"":String(value),placeholder:ph||"",
    class:opt.up?"up":"",inputmode:opt.num?"decimal":"text","data-fk":fk});
  i.addEventListener("input",function(e){
    var raw=e.target.value, v=raw, pos=e.target.selectionStart;
    if(opt.num) v=numFilter(v); else if(opt.up) v=v.toUpperCase();
    if(v!==raw){ e.target.value=v; try{ e.target.setSelectionRange(pos,pos); }catch(err){} }
    onIn(v); touch();
  });
  return i;
}
function cfgArea(arr,ph,fk,onIn,opt){
  opt=opt||{};
  var t=el("textarea",{placeholder:ph||"",class:opt.up?"up":"","data-fk":fk,
    rows:String(Math.max(3,Math.min(8,arr.length+1)))});
  t.value=arr.join("\n");

    var v=e.target.value, pos=e.target.selectionStart;

}

function enviarAcceso(modo){
  var A = state.acc, nombre = (A.nombre||"").trim().replace(/\s+/g," "), usu = (A.usuario||"").trim(), cod = (A.codigo||"").trim(), err = "";
  if(modo==="registro"){
    usu = usu.toLowerCase();
    if(!nombreValido(nombre)) err = "Escribe tu nombre completo, solo con letras (de 3 a 40).";
    else if(!usuarioValido(usu)) err = MSG_USUARIO;
    else if(cod.length<6) err = "El código debe tener al menos 6 caracteres.";
    else if(cod!==(A.codigo2||"").trim()) err = "Los dos códigos no coinciden.";
    else if(!(A.clave||"").trim()) err = "Escribe la clave de invitación que te dio tu administrador.";
  } else if(!usu || !cod) err = "Escribe tu usuario y tu código.";
  if(err){ A.msg={t:"err",m:err}; render(); return; }
  A.ocupado = true; A.msg = null; render();
  var p = modo==="registro" ? registrarse(nombre,usu,cod,(A.clave||"").trim()) : ingresar(usu,cod);
  p.then(function(){
    A.ocupado=false; A.codigo=A.codigo2=A.clave="";
    if(activo()){ state.flash="Bienvenido, "+sesion.nombre+"."; syncConfig(true).then(procesarCola); }
    render(); window.scrollTo(0,0);
  },function(e){
    A.ocupado=false; A.msg={t:"err",m:e.message};
    render();
  });

function importar(texto){
  try{
    var obj = JSON.parse(texto);
    if(!obj || !Array.isArray(obj.frentes)) throw new Error("x");
    ed.cfg = sanitizeCfg(obj); markDirty();
    setMsg(["Configuración importada. Revísala y pulsa Guardar."],"ok");
  }catch(e){
    setMsg(["El texto o archivo no es una configuración válida."],"err");
  }
  render(); window.scrollTo(0,0);
}
function guardarConfig(){
  var publicarInicial = esEditor() && !cfgMeta.version;
  if(!ed.dirty && !publicarInicial){ salirConfig(); return; }
  var errs = validateCfg(ed.cfg);
  if(errs.length){ setMsg(errs,"err"); render(); window.scrollTo(0,0); return; }
  var nueva = sanitizeCfg(clone(ed.cfg));
  if(!conectado()){ cerrarConGuardado(nueva,lsSet(STORE_CFG,JSON.stringify(nueva)),"Configuración guardada en este celular."); return; }
  if(!esEditor()){
    setMsg(["Para guardar cambios para todo el equipo se necesita rol de editor. Pídeselo a tu administrador."],"err");
    render(); window.scrollTo(0,0); return;
  }
  var bar = document.querySelector(".savebar .b-pri"); if(bar){ bar.textContent="Guardando…"; bar.disabled=true; }
  function enviar(force){
    api("saveConfig",{config:nueva,baseVersion:cfgMeta.version,force:!!force}).then(function(j){
      if(j.conflict){
        var msg = "Otro editor"+(j.por?" ("+j.por+")":"")+" cambió la configuración del equipo mientras editabas.\n\n"+
                  "Aceptar: guardar tus cambios encima.\nCancelar: descartar los tuyos y cargar la suya.";
        if(confirm(msg)) return enviar(true);
        ultimaSync = 0;
        return syncConfig(true).then(function(){ ed=null; state.view="inicio"; state.flash="Se cargó la configuración más reciente del equipo."; render(); });
      }
      cfgMeta = {version:j.version,fecha:j.fecha,por:j.por}; lsSet(STORE_META,JSON.stringify(cfgMeta));
      cerrarConGuardado(nueva,lsSet(STORE_CFG,JSON.stringify(nueva)),"Configuración guardada para todo el equipo.");
    },function(e){
      setMsg(["No se pudo guardar en el sistema: "+e.message+(e.server?"":". Revisa la señal e inténtalo de nuevo.")],"err");
      render(); window.scrollTo(0,0);
    });
  }
  enviar(false);
}
function cerrarConGuardado(nueva,ok,texto){
  cfg = nueva;
  ed = null; state.view = "inicio";
  var fr = getFrente(state.estructura);
  if(!fr){ state.estructura=""; state.tipo=""; }
  else if(fr.tipos.indexOf(state.tipo)<0) state.tipo="";
  if(prefs.supervisor && cfg.supervisores.indexOf(prefs.supervisor)<0){ prefs.supervisor=""; savePrefs(); }
  resetForm();
  state.flash = ok?texto:"Configuración aplicada, pero este navegador no permitió guardarla en el celular.";
  render(); window.scrollTo(0,0);
}
function salirConfig(){
  if(ed && ed.dirty && !confirm("Hay cambios sin guardar. ¿Descartarlos?")) return;
  ed = null; state.view = "inicio"; render(); window.scrollTo(0,0);
}

  });
  return secCard("Materiales",null,kids);
}

/* ── líneas del texto por liberación ── */
function resumenLineas(f,k){
  var o = (f.lineas&&f.lineas[k])||{}, por = {O:[],N:[],S:[]};
  (LINEAS[k]||[]).forEach(function(d){
    var v = o[d[0]]; if(!v || v===(d[3]||"S")) return;
    por[v].push(d[1].replace(/\s*\(.*\)$/,""));
  });
  var t = [];
  if(por.N.length) t.push("No: "+por.N.join(", "));
  if(por.O.length) t.push("Pregunta: "+por.O.join(", "));
  if(por.S.length) t.push("Siempre: "+por.S.join(", "));
  return t.join(" · ")||"Como viene por defecto";
}
function listaLineas(f){
  var w = el("div");
  if(!f.tipos.length) w.appendChild(el("div",{class:"sec-d"},["Elige primero los tipos de liberación."]));
  f.tipos.forEach(function(k){
    w.appendChild(el("div",{class:"item"},[
      el("div",{class:"nm"},[el("b",null,[ed.cfg.tipos[k].corto]),el("span",null,[resumenLineas(f,k)])]),
      iconBtn("Configurar ›","",function(){ ed.lt = k; ed.copiaSel = []; state.view = "lineas"; render(); window.scrollTo(0,0); })
    ]));
  });
  return w;
}
function renderLineas(app){
  var f = ed.fr, k = ed.lt, defs = LINEAS[k]||[];
  f.lineas = f.lineas||{};
  var cur = f.lineas[k]||{};
  function volver(){ state.view="frente"; render(); window.scrollTo(0,0); }
  app.appendChild(el("div",{class:"hdr"},[
    el("div",null,[el("div",{class:"k"},[(f.corto||f.nombre||"FRENTE").toUpperCase()]),el("div",{class:"t"},[ed.cfg.tipos[k].corto])]),
    el("button",{class:"hbtn",type:"button",onclick:volver},["← Volver"])
  ]));
  if(ed.msg) app.appendChild(noteBox(ed.msg,ed.msgKind));
  ed.msg = null;

  if(k==="RELLENO") app.appendChild(seccionMateriales(f));
  if(k==="OVERLINER") app.appendChild(seccionOverliner(f));
  if(DIAMS_TIPO[k]) app.appendChild(seccionDiametros(f,k));
  var kids = [el("div",{class:"sec-d"},["Siempre: se pide y sale en el texto. Opcional: la app pregunta “¿Ingresar…?”. Nunca: no se pide ni sale. TIPO DE LIBERACIÓN, ESTRUCTURA y SUPERVISOR CQC salen siempre."])];
  defs.forEach(function(d){
    var v = cur[d[0]] || (d[3]==="AUTO"?"":(d[3]||"S"));
    kids.push(fieldWrap(d[1],optsCtl(v,d[2],function(nv){
      f.lineas[k] = f.lineas[k]||{};
      if(!nv || (nv===(d[3]||"S") && d[3]!=="AUTO")) delete f.lineas[k][d[0]];
      else f.lineas[k][d[0]] = nv;
      if(!Object.keys(f.lineas[k]).length) delete f.lineas[k];
      ed.frDirty = true; render();
    },{labelFn:function(x){return (d[0]==="DET"||d[0]==="PARC"?ESTADO_SINO:ESTADO_TXT)[x];},allowUnset:d[3]==="AUTO"}),
      d[3]==="AUTO"&&!cur[d[0]]?d[4]:(d[4]&&v===d[3]?d[4]:null)));
  });
  kids.push(el("div",{class:"btns",style:"margin-top:4px"},[
    el("button",{class:"b-sec",type:"button",onclick:function(){ delete f.lineas[k]; ed.frDirty=true; render(); }},["Restablecer"])
  ]));
  app.appendChild(secCard("Líneas del texto",null,kids));

  var otros = ed.cfg.frentes.filter(function(o){ return o.id!==f.id && o.tipos.indexOf(k)>=0; });
  if(otros.length){
    ed.copiaSel = (ed.copiaSel||[]).filter(function(id){ return !!findBy(otros,"id",id); });
    var bCp = el("button",{class:"b-pri",type:"button",disabled:!ed.copiaSel.length},
      [ed.copiaSel.length?"Copiar a "+ed.copiaSel.length+" frente"+(ed.copiaSel.length>1?"s":""):"Elige frentes"]);
    bCp.addEventListener("click",function(){
      var n = 0;
      ed.copiaSel.forEach(function(id){
        var o = findBy(ed.cfg.frentes,"id",id); if(!o) return;
        o.lineas = o.lineas||{};
        if(f.lineas[k]) o.lineas[k] = clone(f.lineas[k]); else delete o.lineas[k];
        n++;
      });
      ed.copiaSel = []; ed.dirty = true; ed.frDirty = true;
      setMsg(["Configuración de “"+ed.cfg.tipos[k].corto+"” copiada a "+n+" frente"+(n>1?"s":"")+". Pulsa Aplicar y luego Guardar."],"ok");
      render(); window.scrollTo(0,0);
    });
    app.appendChild(secCard("Copiar líneas a otros frentes","Aplica esta misma configuración de líneas en otros frentes que tienen esta liberación.",[
      multiCtl(ed.copiaSel,otros.map(function(o){return o.id;}),function(id){ var o=findBy(otros,"id",id); return o.corto||o.nombre; },
        function(id){ var i=ed.copiaSel.indexOf(id); if(i>=0) ed.copiaSel.splice(i,1); else ed.copiaSel.push(id); render(); }),
      el("div",{class:"btns"},[bCp])
    ]));
  }
  app.appendChild(el("div",{class:"savebar"},[
    el("span",null,[ed.cfg.tipos[k].corto.charAt(0)+ed.cfg.tipos[k].corto.slice(1).toLowerCase()]),
    el("button",{class:"b-pri",type:"button",onclick:volver},["Listo"])
  ]));
}

/* ════════════════════════════════════════════════════════════════
   RENDER GENERAL
   ════════════════════════════════════════════════════════════════ */
function render(){
  var ae = document.activeElement;
  var keepId = (ae && ae.getAttribute) ? ae.getAttribute("data-fk") : null;
  var keepPos = null;
  if(keepId){ try{ keepPos = ae.selectionStart; }catch(e){} }

  var app = document.getElementById("app");
  app.innerHTML = "";
  if(necesitaAcceso()) renderAcceso(app);
  else if(state.view==="config") renderConfig(app);
  else if(state.view==="frente") renderFrente(app);
  else if(state.view==="lineas") renderLineas(app);
  else if(state.view==="material") renderMaterial(app);
  else if(state.view==="hoy") renderDia(app);
  else if(state.view==="inicio") renderInicio(app);
  else if(state.view==="perfil") renderPerfil(app);
  else if(state.view==="usuarios") renderUsuarios(app);
  else { lastVisibleSig = visibleSignature(); renderMain(app); }

  if(!necesitaAcceso()){   // botones Atrás / Adelante entre la cabecera y el contenido
    navRegistrar();
    var hdr = app.querySelector(".hdr");
    if(hdr && hdr.parentNode===app) app.insertBefore(navBarra(),hdr.nextSibling);
  }

  if(keepId){
    var back = document.querySelector('[data-fk="'+keepId+'"]');
    if(back){ back.focus(); if(keepPos!=null){ try{ back.setSelectionRange(keepPos,keepPos); }catch(e){} } }
  }
}

/* arranque: recuerda el último frente usado */
leerEnlace();
if(prefs.frente && getFrente(prefs.frente)) state.estructura = prefs.frente;
resetForm();
render();

/* sincronización con el equipo */
function alVolver(){ refrescarSesion().then(function(){ return syncConfig(true); }).then(procesarCola); }
alVolver();
window.addEventListener("online",alVolver);
document.addEventListener("visibilitychange",function(){
  if(document.visibilityState==="visible"){ refrescarSesion().then(function(){ return syncConfig(false); }).then(procesarCola); }
});
setInterval(function(){ if(cola.length) procesarCola(); },60000);
/* si cambia el turno (07:00 / 19:00 / medianoche) con la app abierta, se actualiza lo automático */
var sigTurno = (function(){ var a=turnoAuto(); return a.turno+a.fecha; })();
function revisarTurno(){
  var a = turnoAuto(), s = a.turno+a.fecha;
  if(s!==sigTurno){ sigTurno=s; if(state.view==="main" && !document.getElementById("ovTurno")) render(); }
}
setInterval(revisarTurno,30000);
document.addEventListener("visibilitychange",function(){ if(document.visibilityState==="visible") revisarTurno(); });

/* instalación como app (solo cuando se sirve por http/https) */
if("serviceWorker" in navigator && /^https?:$/.test(location.protocol)){
  window.addEventListener("load",function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); });
}
</script>
